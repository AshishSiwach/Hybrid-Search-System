[pytest]
# --confcutdir=tests stops pytest from walking above tests/ during conftest
# discovery — keeps the broken project-root __init__.py out of collection.
# --import-mode=importlib avoids the legacy walk-up-for-parent-package behaviour.
addopts = --confcutdir=tests --import-mode=importlib
testpaths = tests
python_files = test_*.py
